<style>
:root{--red:#C0392B;--red-light:#F4DEDB;--ink:#3A3A3A;--gray:#8A8A8A;--bg:#FDF6F0;--blue:#2C6FAC;--cell:100px;--cell-font:calc(var(--cell) * .42);--print-cell:2.2cm;--print-cell-font:calc(2.2cm * .42)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink)}
#root,[hidden]{display:none!important}
.container{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.site-header{text-align:center;margin-bottom:24px}
.site-header h1{font-size:1.7em;color:var(--red);letter-spacing:.06em}
.site-header .sub{color:var(--gray);font-size:.95em;margin-top:4px}
.options{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px}
.opt-section{margin-bottom:18px}
.opt-section:last-child{margin-bottom:0}
.opt-section h3{font-size:1.05em;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt-group{display:flex;flex-direction:column;gap:4px}
.opt-group label{font-size:.85em;color:var(--gray)}
.opt-group select,.opt-group input{padding:7px 9px;border:1.5px solid #ddd;border-radius:7px;font-size:.95em;width:100%}
.opt-group select:focus,.opt-group input:focus{outline:none;border-color:var(--red)}
.opt-check{display:flex;align-items:center;gap:8px;font-size:.92em;padding:6px 0}
.opt-check input{width:17px;height:17px;accent-color:var(--red)}
.qtype-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.qtype-btn{padding:9px 8px;border:2px solid #e0d5d0;border-radius:9px;background:#fff;cursor:pointer;font-size:.88em;font-weight:600;color:var(--ink);transition:all .15s;text-align:center}
.qtype-btn:hover{border-color:var(--red)}
.qtype-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.gen-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.btn-gen{padding:11px 26px;border:none;border-radius:9px;font-size:1.05em;font-weight:700;background:var(--red);color:#fff;cursor:pointer;transition:all .15s}
.btn-gen:hover{background:#a93226;transform:translateY(-1px)}
.print-bar{display:none;gap:8px;flex-wrap:wrap;margin:14px 0}
.print-bar.show{display:flex}
.print-bar button{padding:9px 18px;border:2px solid var(--red);background:#fff;color:var(--red);border-radius:8px;font-size:.95em;font-weight:600;cursor:pointer;transition:all .15s}
.print-bar button:hover{background:var(--red);color:#fff}
#worksheet{background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-top:10px}
.ws-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;padding-bottom:10px;border-bottom:2px double var(--red)}
.ws-title{font-size:1.5em;font-weight:700;letter-spacing:.06em}
.ws-meta{font-size:.9em;color:var(--gray)}
.qrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.qcell{flex:0 0 var(--qcell-w,var(--cell));width:var(--qcell-w,var(--cell));height:auto;aspect-ratio:1/1;border:1.5px solid #e5dcd6;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;font-size:var(--cell-font);font-weight:700;color:var(--ink);page-break-inside:avoid;overflow:hidden;padding:4px}
.qcell .qtext{line-height:1.25;text-align:center;padding:2px;word-wrap:break-word;max-width:100%;overflow:hidden}
.qcell .ans-line{position:absolute;bottom:6%;left:18%;right:18%;border-bottom:1.5px solid var(--ink)}
.qcell.show-ans::after{content:attr(data-ans);position:absolute;top:6%;right:8%;font-size:.42em;color:var(--red);font-weight:400}
.qcell.vmode{padding:8px}
.qcell.vmode .vmath{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.qcell.vmode .vop{position:absolute;left:12%;top:18%;font-size:.85em}
.qcell.vmode .vline{border-bottom:2px solid var(--ink);width:100%;margin:2px 0}
.qcell.vmode .vans{min-height:1.2em}
.qcell.vmode .vans.fill{width:60%;border-bottom:1.5px solid var(--ink);margin-top:4px}
.qcell.vmode.show-ans .vans::after{content:attr(data-ans);color:var(--red);font-size:.85em;font-weight:400}
.qcell.clock-cell{overflow:hidden}.qcell.clock-cell svg{width:92%;height:92%}
.clock-num{position:absolute;bottom:6%;width:100%;text-align:center;font-size:.5em;color:var(--gray)}
.qcell.frac{text-align:center}.qcell.frac .fnum{font-size:.7em}.qcell.frac .fline{border-top:2px solid var(--ink);width:70%;margin:2px auto}.qcell.frac .fden{font-size:.7em}
.qcell.decimal{font-size:var(--cell-font)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:600px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-header h3{font-size:1.1em}
.modal-close{background:none;border:none;font-size:1.5em;cursor:pointer;color:var(--gray)}
.modal-close:hover{color:var(--red)}
#a4PreviewInfo{font-size:.85em;color:var(--gray);margin-bottom:6px}
#a4PreviewWarn{font-size:.8em;color:#b8860b;margin-bottom:10px}
#a4PreviewFrame{overflow:hidden;border:1px solid #eee;border-radius:6px;background:#fff;position:relative}
.site-footer{text-align:center;color:var(--gray);font-size:.85em;margin-top:40px;line-height:1.7}
.site-footer a{color:var(--blue);text-decoration:none}
.grade-banner{background:linear-gradient(135deg,var(--red) 0%,#e74c3c 100%);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px;font-size:.95em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grade-banner .gb-grade{font-size:1.3em;font-weight:700}
.grade-banner .gb-topics{opacity:.9}
@media print{@page{size:A4;margin:12mm}
body{background:#fff!important}
.site-header,.options,.print-bar,.modal-overlay,.no-print,.grade-banner{display:none!important}
#worksheet{box-shadow:none;margin:0;padding:0;border-radius:0;max-width:none;--cell:var(--print-cell,2.2cm)!important;--cell-font:var(--print-cell-font,calc(2.2cm * .42))!important}
.qrow{gap:4px}
.qcell{flex:0 0 var(--print-cell,2.2cm)!important;width:var(--print-cell,2.2cm)!important;height:var(--print-cell,2.2cm)!important;border:1px solid #c5b8b2;page-break-inside:avoid;font-size:var(--print-cell-font,calc(2.2cm * .42))!important}
.ws-header{border-bottom:.5pt solid var(--red);margin-bottom:14px}}
</style>

<body>
<div class="container">
<header class="site-header">
  <h1>📐 數學練習簿</h1>
  <div class="sub">一年級至六年級 · 數學課題 · 橫式/直式 · 列印 A4 工作紙</div>

<div class="options">
  <div class="opt-section">
    <h3>🎒 年級與課題</h3>

        <label>年級</label>
        <select id="optGrade" onchange="onGradeChange()">
          <option value="p1u">一年級（上）</option>

  <div class="opt-section">

<div class="print-bar no-print" id="printBar">

<script>
'use strict';
/* ===== 年級-課題 curriculum ===== */
const CURRICULUM = {
  p1u: {label:'一年級（上）', topics:['10以內的數','單數和雙數','20以內的數','基本加減']},
  p1l: {label:'一年級（下）', topics:['100以內的數','加與減(一)']},
  p2u: {label:'二年級（上）', topics:['三位數讀寫','加與減(二)','9×9乘法表','乘法配對']},
  p2l: {label:'二年級（下）', topics:['四位數讀寫','加與減(三)','基本除法','有餘數除法']},
  p3u: {label:'三年級（上）', topics:['五位數讀寫','加與減(四)','兩位數乘一位數','除法','單元乘法']},
  p3l: {label:'三年級（下）', topics:['乘加混合','乘減混合','乘除混合','快速算術','分數基礎']},
  p4u: {label:'四年級（上）', topics:['兩位乘兩位','三位乘兩位','長除法','倍數','因數','公倍數','公因數']},
  p4l: {label:'四年級（下）', topics:['除加混合','除減混合','乘除混合','分數：真假帶','擴分約分','分數加減','小數基礎']},
  p5u: {label:'五年級（上）', topics:['多位數讀寫','四捨五入','分數加減','分數乘法','分數四則混合']},
  p5l: {label:'五年級（下）', topics:['小數加減','小數乘法','小數除法','分數除以整數','整數除以分數','分數除以分數']},
  p6u: {label:'六年級（上）', topics:['百分數','百分數加減','小數四則','分數四則','圓形面積','圓周']},
  p6l: {label:'六年級（下）', topics:['體積與容量','比例','簡單方程','概率','平均數','綜合練習']},
};

/* ===== 題目 generators ===== */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function riNot(a,b,not){let v;do{v=ri(a,b)}while(v===not);return v}

function genSingleDigit(){return{q:`${ri(0,5)} + ${ri(0,5)}`,a:null,op:'+',va:0,vb:0,gen:()=>{const a=ri(0,5),b=ri(0,5);return{q:`${a} + ${b}`,a:a+b,va:a,vb:b,op:'+'}}}}
function genOddEven(){
  const n=ri(1,30),ans=n%2===0?'雙':'單';
  return{q:`${n} 是單數還是雙數？`,a:ans,va:n,vb:0,op:'odd',grid:null}
}
function genNumberTrack(max){
  const n=ri(1,max-1);
  return{q:`${n} + 1 = ?`,a:n+1,va:n,vb:1,op:'+'}
}
function genBasicAdd(max){
  const a=ri(1,max-1),b=ri(1,max-a);
  return{q:`${a} + ${b}`,a:a+b,va:a,vb:b,op:'+'}
}
function genBasicSub(max){
  const a=ri(2,max),b=ri(1,a-1);
  return{q:`${a} − ${b}`,a:a-b,va:a,vb:b,op:'−'}
}
function genAdd(max){
  const a=ri(1,max-1),b=ri(1,max-a);
  return{q:`${a} + ${b}`,a:a+b,va:a,vb:b,op:'+'}
}
function genSub(max){
  const a=ri(2,max),b=ri(1,a-1);
  return{q:`${a} − ${b}`,a:a-b,va:a,vb:b,op:'−'}
}
function genMul9x9(){
  const a=ri(2,9),b=ri(2,9);
  return{q:`${a} × ${b}`,a:a*b,va:a,vb:b,op:'×'}
}
function genMul(){
  const a=ri(12,99),b=ri(2,9);
  return{q:`${a} × ${b}`,a:a*b,va:a,vb:b,op:'×'}
}
function genDiv(){
  const b=ri(2,12),q=ri(2,12);
  return{q:`${b*q} ÷ ${b}`,a:q,va:b*q,vb:b,op:'÷'}
}
function genDivRemain(){
  const b=ri(2,9),q=ri(2,9);
  const dividend=b*q+ri(1,b-1);
  return{q:`${dividend} ÷ ${b}`,a:`${Math.floor(dividend/b)}...${dividend%b}`,va:dividend,vb:b,op:'÷R'}
}
function genMixed(){const f=[genAdd.bind(null,100),genSub.bind(null,100),genMul,genDiv];return f[ri(0,3)]()}
function genMulAdd(){const m=ri(2,9),a=ri(1,9);return{q:`${m} × ${a} + ${ri(1,9)}`,a:m*a+ri(1,9),va:m,vb:a,op:'muladd',gen(){const m=ri(2,9),a=ri(1,9),add=ri(1,9);return{q:`${m} × ${a} + ${add}`,a:m*a+add,va:m,vb:a,op:'muladd'}}}}
function genMulSub(){const m=ri(3,9),a=ri(2,9),s=ri(1,m*a-1);return{q:`${m} × ${a} − ${s}`,a:m*a-s,va:m,vb:a,op:'mulsub',gen(){const m=ri(3,9),a=ri(2,9),s=ri(1,m*a-1);return{q:`${m} × ${a} − ${s}`,a:m*a-s,va:m,vb:a,op:'mulsub'}}}}
function genMulDiv(){const m=ri(3,9),d=ri(2,9);return{q:`${m*d} ÷ ${d} × ${m}`,a:m*m,va:m*d,vb:d,op:'muldiv',gen(){const m=ri(3,9),d=ri(2,9);return{q:`${m*d} ÷ ${d} × ${m}`,a:m*m,va:m*d,vb:d,op:'muldiv'}}}}
function genFast(){const ops=['+','−','×'];const q=[];
  for(let i=0;i<3;i++)q.push(ri(1,9));const op1=ops[ri(0,2)],op2=ops[ri(0,2)];
  const expr=`${q[0]} ${op1} ${q[1]} ${op2} ${q[2]}`;let a=q[0];a=op1==='+'?a+q[1]:op1==='−'?a-q[1]:a*q[1];a=op2==='+'?a+q[2]:op2==='−'?a-q[2]:a*q[2];
  return{q:expr,a,va:0,vb:0,op:'fast'}
}
/* --- Fraction basics --- */
function genFracBasic(){
  const d=[2,3,4,5,6][ri(0,4)],n=ri(1,d-1);
  return{q:`${n}/${d}`,a:`${n}/${d}`,va:n,vb:d,op:'frac',frac:{n,d}}
}
function genFracAdd(){
  const d=[2,3,4][ri(0,2)],a=ri(1,d-1),b=ri(1,d-a);
  return{q:`${a}/${d} + ${b}/${d}`,a:`${a+b}/${d}`,va:a,vb:b,op:'fracadd',frac:{n:a+b,d,d1:d,d2:d}}
}
function genFracCompare(){
  const d1=[2,3,4][ri(0,2)],d2=[2,3,4][ri(0,2)],n1=ri(1,d1-1),n2=ri(1,d2-1);
  const v1=n1/d1,v2=n2/d2,ans=v1>v2?'>':v1<v2?'<':'=';
  return{q:`${n1}/${d1} ⃝ ${n2}/${d2}`,a:ans,va:n1,vb:n2,op:'fraccmp'}
}
/* --- Decimal --- */
function genDecAdd(){
  const a=ri(1,9)+ri(1,9)/10,b=ri(1,9)+ri(1,9)/10;
  const r=Math.round((a+b)*10)/10;
  return{q:`${a.toFixed(1)} + ${b.toFixed(1)}`,a:r,va:a,vb:b,op:'+'}
}
function genDecMul(){
  const a=ri(1,9)+ri(1,9)/10,b=ri(1,9);
  const r=Math.round(a*b*10)/10;
  return{q:`${a.toFixed(1)} × ${b}`,a:r,va:a,vb:b,op:'×'}
}
function genRoundOff(){
  const n=ri(10,999);const tens=n%10>=5?1:0;
  return{q:`${n} 四捨五入到十位 = ?`,a:(Math.floor(n/10)+tens)*10,va:n,vb:0,op:'round'}
}
/* --- Percent --- */
function genPct(){
  const base=[100,200,50,250,500][ri(0,4)],pct=[10,20,25,50,75][ri(0,4)];
  const ans=base*pct/100;
  return{q:`${base} 的 ${pct}%`,a:ans,va:base,vb:pct,op:'pct'}
}
/* --- Time --- */
function genClock(){
  const h=ri(1,12),m=[0,5,10,15,20,25,30,35,40,45,50,55][ri(0,11)];
  return{q:'clock',clock:{h,m},a:`${h%12||12}:${String(m).padStart(2,'0')}`,va:h,vb:m,op:'clock'}
}
function genTimeCalc(){
  const h1=ri(0,11),m1=[0,5,10,15,20,25,30,35,40,45,50,55][ri(0,11)];
  const mins=ri(1,12)*5,total=h1*60+m1+mins,h2=Math.floor(total/60),m2=total%60;
  const f=(h,m)=>`${h%12||12}:${String(m).padStart(2,'0')}`;
  return{q:'timecalc',timecalc:{h1,m1,mins},a:f(h2,m2),va:h1,vb:m1,op:'timecalc'}
}
function genNumberLine(){
  const step=[5,10,25,50][ri(0,3)];
  const start=ri(0,5)*step,blank=ri(2,6);
  const vals=[];
  for(let i=0;i<7;i++)vals.push(i===blank?null:start+i*step);
  const ans=start+blank*step;
  return{q:'numberline',numberline:{vals,blank},a:ans,va:start,vb:step,op:'numberline'}
}
/* --- Misc P6 --- */
function genSimpleEq(){
  const x=ri(1,20),coef=ri(2,9),rhs=coef*x;
  return{q:`${coef}x = ${rhs}`,a:x,va:coef,vb:rhs,op:'eq'}
}
function genAvg(){
  const nums=[];let sum=0;
  for(let i=0;i<4;i++){const n=ri(1,20);nums.push(n);sum+=n}
  return{q:`求平均數：${nums.join('、')}`,a:sum/4,va:0,vb:0,op:'avg'}
}
function genSimpleProb(){
  const total=ri(4,12),favor=ri(1,total-1);
  return{q:`袋中有${total}個球，其中${favor}個是紅球。隨機取一個，是紅球的概率？`,a:`${favor}/${total}`,va:favor,vb:total,op:'prob'}
}
function genAreaCircle(){
  const r=ri(1,8);
  return{q:`半徑 ${r} cm 的圓形面積 = ?`,a:`${(Math.PI*r*r).toFixed(1)}`,va:r,vb:0,op:'circle_area'}
}
function genCircumference(){
  const r=ri(1,8);
  return{q:`半徑 ${r} cm 的圓周 = ?`,a:`${(2*Math.PI*r).toFixed(1)}`,va:r,vb:0,op:'circle_circ'}
}
function genVolume(){
  const l=ri(2,8),w=ri(2,6),h=ri(2,5);
  return{q:`長方體 ${l}×${w}×${h} cm³ 體積 = ?`,a:l*w*h,va:l,vb:w,op:'vol'}
}
function genRatio(){
  const a=ri(1,5),b=ri(1,5);
  return{q:`A : B = ${a} : ${b}，A = 12，B = ?`,a:12*b/a,va:a,vb:b,op:'ratio'}
}

/* --- Topic → generator mapping --- */
function pickGen(topic,grade){
  const g=grade;
  // P1
  if(topic==='10以內的數')return{gen:()=>{const a=ri(0,9),b=ri(0,9-a);return{q:`${a} + ${b}`,a:a+b,op:'+'}}};
  if(topic==='單數和雙數')return{gen:()=>{const n=ri(1,30);return{q:`${n} 是單數還是雙數？`,a:n%2===0?'雙':'單',op:'odd'}}};
  if(topic==='20以內的數')return{gen:()=>genAdd(20)};
  if(topic==='基本加減')return{gen:()=>ri(0,1)?genAdd(18):genSub(18)};
  // P1 lower
  if(topic==='100以內的數')return{gen:()=>genAdd(100)};
  if(topic==='加與減(一)')return{gen:()=>ri(0,1)?genAdd(100):genSub(100)};
  // P2
  if(topic==='三位數讀寫')return{gen:()=>{const n=ri(100,999);return{q:`${n} 的百位、十位、個位是？`,a:`${Math.floor(n/100)}、${Math.floor(n/10)%10}、${n%10}`,op:'place'}}};
  if(topic==='加與減(二)')return{gen:()=>ri(0,1)?genAdd(999):genSub(999)};
  if(topic==='9×9乘法表'||topic==='乘法配對')return{gen:genMul9x9};
  if(topic==='四位數讀寫')return{gen:()=>{const n=ri(1000,9999);return{q:`${n} 的千位、百位、十位、個位是？`,a:`${Math.floor(n/1000)}、${Math.floor(n/100)%10}、${Math.floor(n/10)%10}、${n%10}`,op:'place'}}};
  if(topic==='加與減(三)')return{gen:()=>ri(0,1)?genAdd(999):genSub(999)};
  if(topic==='基本除法')return{gen:genDiv};
  if(topic==='有餘數除法')return{gen:genDivRemain};
  // P3
  if(topic==='五位數讀寫')return{gen:()=>{const n=ri(10000,99999);return{q:`${n} 的萬位、千位、百位、十位、個位是？`,a:`${Math.floor(n/10000)}、${Math.floor(n/1000)%10}、${Math.floor(n/100)%10}、${Math.floor(n/10)%10}、${n%10}`,op:'place'}}};
  if(topic==='加與減(四)')return{gen:()=>ri(0,1)?genAdd(999):genSub(999)};
  if(topic==='兩位數乘一位數'||topic==='單元乘法')return{gen:()=>{const a=ri(12,99),b=ri(2,9);return{q:`${a} × ${b}`,a:a*b,va:a,vb:b,op:'×'}}};
  if(topic==='除法')return{gen:genDiv};
  // P3 lower
  if(topic==='乘加混合')return{gen:()=>{const m=ri(2,9),a=ri(1,9),add=ri(1,9);return{q:`${m} × ${a} + ${add}`,a:m*a+add,op:'muladd'}}};
  if(topic==='乘減混合')return{gen:()=>{const m=ri(3,9),a=ri(2,9),s=ri(1,m*a-1);return{q:`${m} × ${a} − ${s}`,a:m*a-s,op:'mulsub'}}};
  if(topic==='乘除混合')return{gen:()=>{const m=ri(3,9),d=ri(2,9);return{q:`${m*d} ÷ ${d} × ${m}`,a:m*m,op:'muldiv'}}};
  if(topic==='快速算術')return{gen:genFast};
  if(topic==='分數基礎')return{gen:()=>{const d=[2,3,4][ri(0,2)],n=ri(1,d-1);return{q:`${n}/${d}`,a:`${n}/${d}`,op:'frac',frac:{n,d}}}};
  // P4 upper
  if(topic==='兩位乘兩位')return{gen:()=>{const a=ri(12,99),b=ri(12,99);return{q:`${a} × ${b}`,a:a*b,va:a,vb:b,op:'×'}}};
  if(topic==='三位乘兩位')return{gen:()=>{const a=ri(100,999),b=ri(12,99);return{q:`${a} × ${b}`,a:a*b,va:a,vb:b,op:'×'}}};
  if(topic==='長除法')return{gen:()=>{const d=ri(12,99),q=ri(2,9);return{q:`${d*q} ÷ ${d}`,a:q,va:d*q,vb:d,op:'÷'}}};
  if(topic==='倍數')return{gen:()=>{const n=[2,3,5,9][ri(0,3)],q=ri(1,6);return{q:`${n} 的倍數表（第${q}個）`,a:n*q,va:n,vb:q,op:'xtable'}}};
  if(topic==='因數')return{gen:()=>{const n=[12,18,24,36,48][ri(0,4)];const f=[];for(let i=1;i<=n;i++)if(n%i===0)f.push(i);return{q:`${n} 的因數是？`,a:f.join('、'),op:'factors'}}};
  if(topic==='公倍數')return{gen:()=>{const a=ri(2,6),b=ri(2,6);const lcm=Math.abs(a*b)/gcd(a,b);return{q:`${a} 和 ${b} 的最小公倍數`,a:lcm,va:a,vb:b,op:'lcm'}}};
  if(topic==='公因數')return{gen:()=>{const a=ri(6,30),b=ri(6,30);return{q:`${a} 和 ${b} 的最大公因數`,a:gcd(a,b),va:a,vb:b,op:'gcd'}}};
  // P4 lower
  if(topic==='除加混合')return{gen:()=>{const d=ri(2,9),q=ri(2,9),add=ri(1,9);return{q:`${d*q} ÷ ${d} + ${add}`,a:q+add,op:'divadd'}}};
  if(topic==='除減混合')return{gen:()=>{const d=ri(2,9),q=ri(3,9),sub=ri(1,q-1);return{q:`${d*q} ÷ ${d} − ${sub}`,a:q-sub,op:'divsub'}}};
  if(topic==='分數：真假帶'||topic==='擴分約分'||topic==='分數加減'){
    if(topic==='擴分約分')return{gen:()=>{const d=[2,3,4,5][ri(0,3)],m=ri(2,5);return{q:`${d}/${d*m} = ?/${m}`,a:d,op:'eqfrac'}}};
    if(topic==='分數加減')return{gen:genFracAdd};
    return{gen:genFracBasic};
  }
  if(topic==='小數基礎')return{gen:genDecAdd};
  // P5 upper
  if(topic==='多位數讀寫')return{gen:()=>{const n=ri(100000,999999);return{q:`${n} 是？`,a:n.toLocaleString(),op:'place'}}};
  if(topic==='四捨五入')return{gen:genRoundOff};
  if(topic==='分數加減')return{gen:genFracAdd};
  if(topic==='分數乘法')return{gen:()=>{const d1=[2,3,4][ri(0,2)],d2=[2,3,4][ri(0,2)],n1=ri(1,d1-1),n2=ri(1,d2-1);return{q:`${n1}/${d1} × ${n2}/${d2}`,a:`${n1*n2}/${d1*d2}`,op:'fracmul'}}};
  if(topic==='分數四則混合')return{gen:genFracAdd};
  // P5 lower
  if(topic==='小數加減')return{gen:genDecAdd};
  if(topic==='小數乘法')return{gen:genDecMul};
  if(topic==='小數除法')return{gen:()=>{const d=[2,5][ri(0,1)],n=ri(1,9)+ri(1,9)/d;return{q:`${n.toFixed(1)} ÷ ${d}`,a:(n/d).toFixed(1),op:'÷'}}};
  if(topic==='分數除以整數'||topic==='整數除以分數'||topic==='分數除以分數')return{gen:()=>{const d=ri(2,6),n=ri(1,d-1);return{q:`${n}/${d} = ?`,a:`${n}/${d}`,op:'frac'}}};
  // P6 upper
  if(topic==='百分數'||topic==='百分數加減')return{gen:genPct};
  if(topic==='小數四則')return{gen:genDecAdd};
  if(topic==='分數四則')return{gen:genFracAdd};
  if(topic==='圓形面積')return{gen:genAreaCircle};
  if(topic==='圓周')return{gen:genCircumference};
  // P6 lower
  if(topic==='體積與容量')return{gen:genVolume};
  if(topic==='比例')return{gen:genRatio};
  if(topic==='簡單方程')return{gen:genSimpleEq};
  if(topic==='概率')return{gen:genSimpleProb};
  if(topic==='平均數')return{gen:genAvg};
  if(topic==='綜合練習')return{gen:genMixed};
  // clock/timecalc always available
  if(topic==='讀時鐘')return{gen:genClock};
  if(topic==='時間計算')return{gen:genTimeCalc};
  if(topic==='數線')return{gen:genNumberLine};
  // default
  return{gen:()=>{const a=ri(1,99),b=ri(1,99);return{q:`${a} + ${b}`,a:a+b,op:'+'}}};
}
function gcd(a,b){return b?gcd(b,a%b):a}

function $(id){return document.getElementById(id)}

function onGradeChange(){
  const grade=$('optGrade').value;
  const sel=$('optTopic');
  const topics=CURRICULUM[grade]?.topics||[];
  // add clock/timecalc as always-available
  sel.innerHTML='<option value="">— 選擇課題 —</option><optgroup label="📏 本年級課題">'+topics.map(t=>`<option value="${t}">${t}</option>`).join('')+'</optgroup><optgroup label="🕐 時間與數線"><option value="讀時鐘">🕐 讀時鐘</option><option value="時間計算">⏱ 時間計算</option><option value="數線">📏 數線</option></optgroup>';
  onTopicChange();
}
function onTopicChange(){
  const topic=$('optTopic').value;
  // layout hint
  const vtopics=['長除法','兩位乘兩位','三位乘兩位','乘加混合','乘減混合','乘除混合','除加混合','除減混合'];
  $('optLayout').value=vtopics.includes(topic)?'v':'h';
}

function generate(reseed){
  const grade=$('optGrade').value;
  const topic=$('optTopic').value;
  if(!topic){alert('請先選擇課題！');return}
  const count=parseInt($('optCount').value)||24;
  const perRow=parseInt($('optPerRow').value)||6;
  const layout=$('optLayout').value;
  const printSize=$('optPrintSize').value;
  const showAns=$('optShowAns').checked;
  const underline=$('optUnderline').checked;
  const num=$('optNum').checked;
  const title=$('optTitle').value.trim()||$('optGrade').selectedOptions[0].text;
  const name=$('optName').value.trim();
  const date=$('optDate').value.trim()||new Date().toLocaleDateString('zh-HK');

  const{gen}=pickGen(topic,grade);
  const questions=[];
  for(let i=0;i<count;i++){const q=typeof gen==='function'?gen():gen.gen();questions.push(q)}

  render(questions,{grade,topic,count,perRow,layout,printSize,showAns,underline,num,title,name,date});
  try{localStorage.setItem('me_prefs',JSON.stringify({grade,topic,count,perRow,layout,printSize,showAns,underline,num,title,name,date}))}catch(e){}
}

function render(questions,opts){
  $('printBar').classList.add('show');
  $('wsTitle').textContent=opts.title;
  $('wsMeta').textContent=[opts.name&&('姓名：'+opts.name),opts.date&&('日期：'+opts.date)].filter(Boolean).join('　')||opts.date;

  const ws=$('worksheet');
  // Responsive cell size: fit perRow columns in the available width
  const avail = Math.min(window.innerWidth - 48, 900);
  const gaps = (opts.perRow - 1) * 8;
  const cellPx = Math.max(56, Math.floor((avail - gaps) / opts.perRow));
  const fontPx = Math.round(cellPx * .42);
  ws.style.setProperty('--cell', cellPx + 'px');
  ws.style.setProperty('--cell-font', fontPx + 'px');
  ws.style.setProperty('--print-cell',opts.printSize);
  ws.style.setProperty('--print-cell-font',`calc(${opts.printSize} * .42)`);
  ws.style.setProperty('--qcell-w', `calc((100% - ${gaps}px)/${opts.perRow})`);

  const area=$('qArea');area.innerHTML='';
  let row;
  questions.forEach((q,idx)=>{
    if(idx%opts.perRow===0){row=document.createElement('div');row.className='qrow';area.appendChild(row)}
    const cell=document.createElement('div');
    cell.className='qcell'+(q.op==='clock'?' clock-cell':'');
    if(opts.showAns)cell.classList.add('show-ans');
    cell.dataset.ans=typeof q.a==='number'?q.a:q.a;

    if(q.op==='clock'){
      cell.innerHTML=clockSVG(q.clock.h,q.clock.m);
      const nd=document.createElement('div');nd.className='clock-num';nd.textContent='___:___';cell.appendChild(nd);
    }else if(q.op==='timecalc'){
      const inner=document.createElement('div');inner.className='qtext';inner.style.fontSize='11px';inner.style.lineHeight='1.3';inner.style.padding='2px';
      const tc=q.timecalc,f=(h,m)=>`${h%12||12}:${String(m).padStart(2,'0')}`;
      inner.innerHTML=`${f(tc.h1,tc.m1)} + ${tc.mins}分<br>= ?`;cell.appendChild(inner);
      if(opts.underline){const l=document.createElement('div');l.className='ans-line';cell.appendChild(l)}
    }else if(q.op==='numberline'){
      cell.style.cssText='width:auto;min-width:var(--cell);padding:4px 6px;overflow:visible';
      const nl=q.numberline,step=Math.floor(100/(nl.vals.length+1)),right=10;
      let svg=`<svg viewBox="0 0 200 60" style="width:100%;height:100%"><line x1="5" y1="30" x2="195" y2="30" stroke="var(--ink)" stroke-width="2"/><polygon points="190,25 200,30 190,35" fill="var(--ink)"/>`;
      nl.vals.forEach((v,i)=>{
        const x=15+i*step;
        svg+=`<line x1="${x}" y1="25" x2="${x}" y2="35" stroke="var(--ink)" stroke-width="2"/>`;
        if(v!==null)svg+=`<text x="${x}" y="50" text-anchor="middle" font-size="11" fill="var(--ink)">${v}</text>`;
        else svg+=`<text x="${x}" y="50" text-anchor="middle" font-size="11" fill="var(--red)" font-weight="700">？</text>`;
      });
      svg+=`</svg>`;cell.innerHTML=svg;
    }else if(opts.layout==='v'&&['+','−','×','÷'].includes(q.op)){
      cell.classList.add('vmode');cell.style.fontSize='calc(var(--cell-font) * .72)';
      const v=document.createElement('div');v.className='vmath';
      const op=document.createElement('span');op.className='vop';op.textContent=q.op;
      const va=String(q.va||0),vb=String(q.vb||0),pad=Math.max(va.length,vb.length);
      const n1=document.createElement('div');n1.textContent=va.padStart(pad);
      const line=document.createElement('div');line.className='vline';
      const n2=document.createElement('div');n2.textContent=vb.padStart(pad);
      const ans=document.createElement('div');ans.className='vans'+(opts.underline?' fill':'');ans.dataset.ans=q.a;
      v.append(op,n1,line,n2,ans);cell.appendChild(v);
    }else{
      const inner=document.createElement('div');inner.className='qtext';
      inner.textContent=q.q;cell.appendChild(inner);
      // Auto-shrink long questions (word problems, 因數, 概率, 平均數…) so they fit the cell
      const qlen=(q.q||'').length;
      if(qlen>20){inner.style.fontSize='9px';inner.style.lineHeight='1.35'}
      else if(qlen>12){inner.style.fontSize='12px';inner.style.lineHeight='1.3'}
      else if(qlen>7){inner.style.fontSize='16px'}
      if(opts.underline){const l=document.createElement('div');l.className='ans-line';cell.appendChild(l)}
    }
    if(opts.num){const n=document.createElement('span');n.style.cssText='position:absolute;top:4%;left:6%;font-size:.3em;color:var(--gray);font-weight:400';n.textContent=idx+1;cell.appendChild(n)}
    row.appendChild(cell);
  });
}

function clockSVG(h,m){
  const ha=(h%12)*30+(m/2),ma=m*6;
  const hx=50+26*Math.sin(ha*Math.PI/180),hy=50-26*Math.cos(ha*Math.PI/180);
  const mx=50+34*Math.sin(ma*Math.PI/180),my=50-34*Math.cos(ma*Math.PI/180);
  let ticks='';
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180;ticks+=`<line x1="${(50+42*Math.sin(a)).toFixed(1)}" y1="${(50-42*Math.cos(a)).toFixed(1)}" x2="${(50+46*Math.sin(a)).toFixed(1)}" y2="${(50-46*Math.cos(a)).toFixed(1)}" stroke="#888" stroke-width="1.5"/>`}
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="47" fill="none" stroke="#3A3A3A" stroke-width="2.5"/>${ticks}<line x1="50" y1="50" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="2.5" fill="#3A3A3A"/></svg>`;
}

function toggleShowAns(){
  document.querySelectorAll('.qcell').forEach(c=>c.classList.toggle('show-ans'));
}

function openA4Preview(){
  const ws=$('worksheet'),overlay=$('a4PreviewOverlay'),frame=$('a4PreviewFrame'),info=$('a4PreviewInfo');
  info.textContent=`題數：${document.querySelectorAll('.qcell').length} · 每行：${$('optPerRow').value}格 · 印刷格：${$('optPrintSize').value}`;
  const ps = $('optPrintSize').value;
  const clone=ws.cloneNode(true);
  Object.assign(clone.style,{position:'relative',margin:'0',width:'794px',maxWidth:'none',boxShadow:'none',padding:'45px'});
  clone.style.setProperty('--cell','86px');
  clone.style.setProperty('--cell-font','calc(86px * .42)');
  clone.style.setProperty('--qcell-w','100px');
  clone.style.setProperty('--print-cell',ps);
  clone.style.setProperty('--print-cell-font','calc(' + ps + ' * .42)');
  clone.querySelectorAll('.no-print').forEach(el=>el.remove());
  frame.innerHTML='';frame.appendChild(clone);
  frame.style.width=Math.round(794*.5)+'px';frame.style.height=Math.round(1123*.5)+'px';
  clone.style.transform='scale(.5)';clone.style.transformOrigin='top left';
  overlay.style.display='flex';overlay.classList.add('show');
}
function closeA4Preview(){$('a4PreviewOverlay').classList.remove('show');$('a4PreviewOverlay').style.display='none'}

/* ===== init ===== */
(function(){
  try{const p=JSON.parse(localStorage.getItem('me_prefs')||'{}');if(p.grade)$('optGrade').value=p.grade;if(p.topic)$('optTopic').value=p.topic;if(p.count)$('optCount').value=p.count;if(p.perRow)$('optPerRow').value=p.perRow;if(p.layout)$('optLayout').value=p.layout;if(p.printSize)$('optPrintSize').value=p.printSize;if(p.showAns!==undefined)$('optShowAns').checked=p.showAns;if(p.underline!==undefined)$('optUnderline').checked=p.underline;if(p.num!==undefined)$('optNum').checked=p.num;if(p.title!==undefined)$('optTitle').value=p.title;if(p.name!==undefined)$('optName').value=p.name;if(p.date!==undefined)$('optDate').value=p.date}catch(e){}
  onGradeChange();
  if($('optTopic').value)$('optTopic').value=$('optTopic').value;
  generate();
})();
</script>
